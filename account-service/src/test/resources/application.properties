# H2 In-Memory Database para Tests Unitarios y de Integración
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.format_sql=true

# Resilience4j Retry Configuration
resilience4j.retry.instances.movementCreation.max-attempts=3
resilience4j.retry.instances.movementCreation.wait-duration=100ms
resilience4j.retry.instances.movementCreation.enable-exponential-backoff=false
resilience4j.retry.instances.movementCreation.ignore-exceptions=com.tata.accountservice.exception.NotAllowedException,com.tata.accountservice.exception.NotFoundException

spring.application.name=account-service

server.port=8080

# SpringDoc OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# PostgreSQL Database (Despliegue)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/account_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:tata}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.format_sql=true

# Jackson
spring.jackson.default-property-inclusion=NON_NULL

# RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Resilience4j Retry Configuration
resilience4j.retry.instances.movementCreation.max-attempts=3
resilience4j.retry.instances.movementCreation.wait-duration=1s
resilience4j.retry.instances.movementCreation.enable-exponential-backoff=true
resilience4j.retry.instances.movementCreation.exponential-backoff-multiplier=2
resilience4j.retry.instances.movementCreation.ignore-exceptions[0]=com.tata.accountservice.exception.NotAllowedException
resilience4j.retry.instances.movementCreation.ignore-exceptions[1]=com.tata.accountservice.exception.NotFoundException
